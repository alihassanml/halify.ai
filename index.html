    <style>
      html {
        color-scheme: light;
      }

      body {
        @apply bg-background text-on-background font-body-md selection:bg-primary-fixed-dim;
      }

      .glass-panel, .glass-card {
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        background-clip: padding-box;
      }

      .glass-card {
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      }

      .primary-cta {
        @apply bg-gradient-to-r from-primary to-secondary text-on-primary font-semibold border-none cursor-pointer transition-all;
        box-shadow: 0 4px 16px rgba(0, 74, 198, 0.3);
      }

      .primary-cta:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(0, 74, 198, 0.4);
      }

      .primary-cta:active {
        transform: translateY(0);
      }

      .reveal {
        animation: reveal 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        opacity: 0;
      }

      @keyframes reveal {
        0% {
          opacity: 0;
          transform: translateY(30px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .logo-carousel-track {
        display: flex;
        animation: carousel 30s linear infinite;
      }

      @keyframes carousel {
        0% { transform: translateX(0); }
        100% { transform: translateX(-100%); }
      }

      .logo-carousel-track:hover {
        animation-play-state: paused;
      }

      .stats-grid {
        display: grid;
        gap: 1.5rem;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      }

      @media (max-width: 768px) {
        .md\:flex { display: none; }
        .md\:hidden { display: flex; }
      }

      @media (min-width: 769px) {
        .md\:flex { display: flex; }
        .md\:hidden { display: none; }
      }
    </style>
    <title>Halify - AI-Powered Software Development</title>
  </head>
  <body class="bg-background text-on-background font-body-md selection:bg-primary-fixed-dim">
    <div id="root"></div>
    <script>
      // Force light mode always
      document.documentElement.classList.remove('dark');
      document.documentElement.setAttribute('data-theme', 'light');
      document.documentElement.style.colorScheme = 'light';

      // Prevent dark mode from being added
      const observer = new MutationObserver(() => {
        if (document.documentElement.classList.contains('dark')) {
          document.documentElement.classList.remove('dark');
        }
      });

      observer.observe(document.documentElement, {
        attributes: true,
        attributeFilter: ['class'],
        attributeOldValue: true
      });

      // Handle prefers-color-scheme changes
      if (window.matchMedia) {
        const darkModeQuery = window.matchMedia('(prefers-color-scheme: dark)');
        darkModeQuery.addEventListener('change', () => {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
