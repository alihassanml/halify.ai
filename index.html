<!doctype html>
<html lang="en" class="scroll-smooth light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Halify — AI engineering studio building intelligent products: AI agents, RAG systems, full-stack apps, mobile, and cloud infrastructure for startups and enterprises." />
    <meta name="color-scheme" content="light" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      try {
        tailwind.config = {
          darkMode: false,
          theme: {
            extend: {
              colors: {
                ink: "#0B0E14",
                "ink-soft": "#4B5468",
                "ink-faint": "#8A93A6",
                paper: "#FFFFFF",
                "paper-alt": "#F6F7FB",
                "paper-alt-2": "#EEF0F8",
                line: "#E6E8F0",
                "line-soft": "#EEF0F6",
                primary: "#2454FF",
                "primary-dark": "#173BBF",
                "primary-soft": "#EAF0FF",
                violet: "#7C3AED",
                "violet-soft": "#F3EBFE",
                amber: "#F59E0B",
                "amber-soft": "#FEF3E2",
                success: "#16A34A"
              },
              fontFamily: {
                sans: ["Inter", "system-ui", "sans-serif"],
                display: ["Sora", "Inter", "system-ui", "sans-serif"]
              },
              maxWidth: {
                container: "1280px"
              },
              boxShadow: {
                card: "0 1px 2px rgba(11,14,20,0.04), 0 8px 24px -8px rgba(11,14,20,0.08)",
                "card-hover": "0 4px 12px rgba(11,14,20,0.06), 0 24px 48px -16px rgba(36,84,255,0.18)",
                nav: "0 1px 0 rgba(11,14,20,0.06), 0 8px 24px -12px rgba(11,14,20,0.08)"
              },
              keyframes: {
                marquee: {
                  "0%": { transform: "translateX(0)" },
                  "100%": { transform: "translateX(-50%)" }
                },
                float: {
                  "0%, 100%": { transform: "translateY(0px) rotate(0deg)" },
                  "50%": { transform: "translateY(-16px) rotate(2deg)" }
                },
                "fade-up": {
                  "0%": { opacity: "0", transform: "translateY(24px)" },
                  "100%": { opacity: "1", transform: "translateY(0)" }
                }
              },
              animation: {
                marquee: "marquee 28s linear infinite",
                float: "float 6s ease-in-out infinite"
              }
            }
          }
        };
      } catch(_e) {}
    </script>
    <title>Halify — AI Engineering Studio for Startups &amp; Enterprises</title>
  </head>
  <body class="bg-paper text-ink font-sans antialiased selection:bg-primary/20 selection:text-ink">
    <div id="root"></div>
    <script>
      document.documentElement.classList.remove('dark');
      document.documentElement.setAttribute('data-theme', 'light');
      document.documentElement.style.colorScheme = 'light';
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
